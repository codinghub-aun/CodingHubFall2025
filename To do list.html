<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>To‑Do List</title>
    <style>
        body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:24px;max-width:700px}
        form{display:flex;gap:8px;margin-bottom:12px}
        input[type="text"]{flex:1;padding:8px;font-size:16px}
        button{padding:8px 12px;font-size:14px}
        ul{list-style:none;padding:0;margin:0}
        li{display:flex;align-items:center;gap:8px;padding:6px 4px;border:1px solid #eee}
    </style>
</head>
<body>
    <h1>To‑Do List</h1>
    <form>
        <input type="text" placeholder="Add a new task..." />
        <button>Add</button>
    </form>
    <ul>
        <li>task 1</li>
        <li>task 2</li>
        <li>task 3</li>
        <li>task 4</li>
    </ul>
    <form>
        <input type="text" placeholder="Remove new task..." />
        <button>Remove</button>
    </form>
    <ul>
        <li>task 1</li>
        <li>task 2</li>
        <li>task 3</li>
        <li>task 4</li>
    </ul>
     <form>
        <input type="text" placeholder="Mark task..." />
        <button>Mark</button>
    </form>
    <ul>
        <li>task 1</li>
        <li>task 2</li>
        <li>task 3</li>
        <li>task 4</li>
    </ul>
</body>
</html>
